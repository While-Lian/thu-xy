<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 清华大学行健书院班级共建系统</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .btn-git-login { width: 100%; padding: 12px; background: #2b579a; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; letter-spacing: 1px; cursor: pointer; transition: all .15s; font-family: inherit; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-git-login:hover { background: #1e3f73; box-shadow: 0 6px 20px rgba(43, 87, 154, 0.3); }
    .btn-git-login:disabled { background: #ccc; cursor: not-allowed; }
    .divider-text { text-align: center; margin: 16px 0; font-size: 12px; color: #999; position: relative; }
    .divider-text::before, .divider-text::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: #eee; }
    .divider-text::before { left: 0; }
    .divider-text::after { right: 0; }
  </style>
</head>
<body class="login-body">

  <div class="login-wrap">
    <div class="login-brand">
      <div class="login-logo">清</div>
      <h1>清华大学行健书院班级共建系统</h1>
    </div>

    <div class="login-card">
      <div id="login-view">
        <h2 class="login-title">登 录</h2>
        
        <button type="button" id="tsinghua-git-login" class="btn-git-login">
          <span style="font-size:18px;">🎓</span> 使用清华 Git 身份登录
        </button>

        <div class="divider-text">或使用账号密码</div>

        <form id="login-form" autocomplete="on">
          <div class="input-wrap"><span class="input-icon">👤</span><input type="email" id="login-email" placeholder="账户名 / 邮箱" required /></div>
          <div class="input-wrap"><span class="input-icon">🔒</span><input type="password" id="login-password" placeholder="密码" required /></div>
          <button type="submit" class="btn-login">登 录</button>
        </form>
        <div class="login-options">
          <a href="#" id="forgot-link">忘记密码？</a>
          <a href="#" id="to-register">立即注册！</a>
        </div>
      </div>

      <div id="register-view" style="display:none;">
        <h2 class="login-title">注 册</h2>
        <form id="register-form">
          <div class="input-wrap"><span class="input-icon">✉️</span><input type="email" id="reg-email" placeholder="邮箱" required /></div>
          <div class="input-wrap"><span class="input-icon">🔒</span><input type="password" id="reg-password" placeholder="密码（至少 6 位）" required minlength="6" /></div>
          <div class="input-wrap"><span class="input-icon">👤</span><input type="text" id="reg-nickname" placeholder="昵称（同学看到的名字）" required maxlength="20" /></div>
          <div class="input-wrap"><span class="input-icon">🔑</span><input type="text" id="reg-invite-code" placeholder="邀请码（老师/辅导员填，同学留空）" /></div>
          <button type="submit" class="btn-login">注 册</button>
        </form>
        <div class="login-options"><a href="#" id="to-login">已有账号？返回登录</a></div>
      </div>

      <div id="forgot-view" style="display:none;">
        <h2 class="login-title">忘记密码</h2>
        <p style="color:#666;font-size:14px;line-height:1.8;text-align:center;margin:16px 0 24px;">
          请联系<b style="color:#660874;">班级管理员</b>协助重置密码。
        </p>
        <div class="login-options" style="justify-content:center;"><a href="#" id="forgot-back">← 返回登录</a></div>
      </div>

      <p id="auth-msg" class="auth-msg"></p>
    </div>
    <p class="login-footer">Developed by 陈炼 · 徐天泽</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    (function() {
      const GIT_CLIENT_ID = 'f6cb44834a83135bba8d8e67b94964a7d32c382699352caf34e13463e82c0dea'; 
      const REDIRECT_URI = 'https://while-lian.github.io/thu-xy/oauth-callback.html'; 
      
      const db = window.supabaseClient;
      const gitBtn = document.getElementById('tsinghua-git-login');
      const authMsg = document.getElementById('auth-msg');
      const loginEmailInput = document.getElementById('login-email');

      gitBtn.addEventListener('click', async () => {
        try {
          gitBtn.disabled = true;
          gitBtn.innerHTML = '<span style="font-size:18px;">⏳</span> 正在连接...';
          
          const codeVerifier = generateRandomString(64);
          const codeChallenge = await sha256(codeVerifier);
          const state = generateRandomString(16);

          sessionStorage.setItem('oauth_code_verifier', codeVerifier);
          sessionStorage.setItem('oauth_state', state);

          const authUrl = new URL('https://git.tsinghua.edu.cn/oauth/authorize');
          authUrl.searchParams.set('client_id', GIT_CLIENT_ID);
          authUrl.searchParams.set('redirect_uri', REDIRECT_URI);
          authUrl.searchParams.set('response_type', 'code');
          authUrl.searchParams.set('scope', 'read_user');
          authUrl.searchParams.set('state', state);
          authUrl.searchParams.set('code_challenge', codeChallenge);
          authUrl.searchParams.set('code_challenge_method', 'S256');

          window.open(authUrl.toString(), 'THU_AUTH', 'width=600,height=700');
          
          gitBtn.disabled = false;
          gitBtn.innerHTML = '<span style="font-size:18px;">🎓</span> 使用清华 Git 身份登录';
        } catch (err) {
          authMsg.textContent = '发起认证失败：' + err.message;
          authMsg.className = 'auth-msg error';
          gitBtn.disabled = false;
        }
      });

      window.addEventListener('message', async (event) => {
        if (event.data && event.data.type === 'TSINGHUA_GIT_AUTH') {
          const gitUser = event.data.user;
          if (!gitUser.email) return authMsg.textContent = '认证成功，但未获取到清华邮箱。';

          loginEmailInput.value = gitUser.email;
          authMsg.textContent = '清华身份验证成功，正在合并账号并登录...';
          authMsg.className = 'auth-msg';

          // 生成内部快捷密码
          const internalPassword = `THU_XY_GIT_${gitUser.id}_SECURE_2026`;

          try {
            // 1. 用内部快捷密码尝试直接登录（如果是曾经用清华登录过的老用户，直接成功）
            let { data: signInData, error: signInError } = await db.auth.signInWithPassword({
              email: gitUser.email,
              password: internalPassword
            });

            if (signInData && signInData.session) {
              authMsg.textContent = '合并登录成功，正在进入系统...';
              authMsg.className = 'auth-msg success';
              window.location.href = 'index.html';
              return;
            }

            // 2. 如果密码不对（说明他曾经用别的密码注册过），尝试注册
            const { data: signUpData, error: signUpError } = await db.auth.signUp({
              email: gitUser.email,
              password: internalPassword,
              options: { data: { nickname: gitUser.name || gitUser.username || '同学' } }
            });

            // 3. 【核心合并逻辑】如果注册报“已存在”，或者依然拿不到 Session，说明是已有账号。
            // 此时，调用我们写好的 RPC，强制把该邮箱的密码重置为内部快捷密码（为了实现无缝合并）
            if (signUpError && signUpError.message.includes('already registered')) {
                // 调用底层强行重置函数
                await db.rpc('force_login_user', { 
                  p_email: gitUser.email, 
                  p_password: internalPassword 
                });
            } else if (!signUpData.session) {
                // 新注册成功但没给 Session（因为后台 Confim Email 没关死）
                await db.rpc('force_login_user', { 
                  p_email: gitUser.email, 
                  p_password: internalPassword 
                });
            }

            // 4. 既然密码已经在底层被强行重置为内部快捷密码，现在绝对能登进去了
            const { data: retryData, error: retryError } = await db.auth.signInWithPassword({
              email: gitUser.email,
              password: internalPassword
            });

            if (retryData && retryData.session) {
              authMsg.textContent = '账号合并成功，正在进入系统...';
              authMsg.className = 'auth-msg success';
              
              // 存入 localStorage，用于提示用户去修改密码
              localStorage.setItem('thu_xy_merged_account', '1');
              
              window.location.href = 'index.html';
            } else {
              throw new Error('自动合并失败，请稍后重试。');
            }

          } catch (err) {
            authMsg.textContent = '登录失败：' + err.message;
            authMsg.className = 'auth-msg error';
          }
        }
      });

      function generateRandomString(length) {
        const array = new Uint8Array(length);
        window.crypto.getRandomValues(array);
        return Array.from(array, dec => dec.toString(16).padStart(2, '0')).join('');
      }

      async function sha256(plain) {
        const encoder = new TextEncoder();
        const data = encoder.encode(plain);
        const hash = await crypto.subtle.digest('SHA-256', data);
        return btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
    })();
  </script>
</body>
</html>
