<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- PWA 配置 -->
  <link rel="manifest" href="/thu-xy/manifest.json">
  <meta name="theme-color" content="#660874">
  <link rel="apple-touch-icon" href="/thu-xy/icon-192.png">
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 清华大学行健书院班级共建系统</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* 针对一键登录按钮单独加点样式 */
    .btn-git-login {
      width: 100%;
      padding: 12px;
      background: #2b579a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all .15s;
      font-family: inherit;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-git-login:hover { background: #1e3f73; box-shadow: 0 6px 20px rgba(43, 87, 154, 0.3); }
    .divider-text {
      text-align: center;
      margin: 16px 0;
      font-size: 12px;
      color: #999;
      position: relative;
    }
    .divider-text::before, .divider-text::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #eee;
    }
    .divider-text::before { left: 0; }
    .divider-text::after { right: 0; }
  </style>
</head>
<body class="login-body">

  <div class="login-wrap">
    <div class="login-brand">
      <div class="login-logo">清</div>
      <h1>清华大学行健书院班级共建系统</h1>
      <p class="login-brand-sub">THU Xingjian College · Class Co-building System</p>
    </div>

    <div class="login-card">
      <!-- 登录 -->
      <div id="login-view">
        <h2 class="login-title">登 录</h2>
        
        <!-- 清华 Git 一键登录入口 -->
        <button type="button" id="tsinghua-git-login" class="btn-git-login">
          <span style="font-size:18px;">🎓</span> 使用清华 Git 身份登录
        </button>
        
        <div class="divider-text">或使用账号密码</div>

        <form id="login-form" autocomplete="on">
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="email" id="login-email" placeholder="账户名 / 邮箱" required autocomplete="username" />
          </div>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="login-password" placeholder="密码" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn-login">登 录</button>
        </form>
        <div class="login-options">
          <a href="#" id="forgot-link">忘记密码？</a>
          <a href="#" id="to-register">立即注册！</a>
        </div>
      </div>

      <!-- 注册 -->
      <div id="register-view" style="display:none;">
        <h2 class="login-title">注 册</h2>
        <form id="register-form">
          <div class="input-wrap">
            <span class="input-icon">✉️</span>
            <input type="email" id="reg-email" placeholder="邮箱" required />
          </div>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="reg-password" placeholder="密码（至少 6 位）" required minlength="6" />
          </div>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="reg-nickname" placeholder="昵称（同学看到的名字）" required maxlength="20" />
          </div>
          <div class="input-wrap">
            <span class="input-icon">🔑</span>
            <input type="text" id="reg-invite-code" placeholder="邀请码（老师/辅导员填，同学留空）" />
          </div>
          <button type="submit" class="btn-login">注 册</button>
        </form>
        <div class="login-options">
          <a href="#" id="to-login">已有账号？返回登录</a>
        </div>
        <div class="auth-hint" id="reg-hint">
          普通同学无需邀请码；老师/辅导员请填写老师邀请码
        </div>
      </div>

      <!-- 忘记密码 -->
      <div id="forgot-view" style="display:none;">
        <h2 class="login-title">忘记密码</h2>
        <p style="color:#666;font-size:14px;line-height:1.8;text-align:center;margin:16px 0 24px;">
          请联系<b style="color:#660874;">班级管理员</b>协助重置密码。<br />
          重置后请尽快登录并在「个人中心」修改为新密码。
        </p>
        <div class="login-options" style="justify-content:center;">
          <a href="#" id="forgot-back">← 返回登录</a>
        </div>
      </div>

      <p id="auth-msg" class="auth-msg"></p>
    </div>

    <p class="login-footer">Developed by 陈炼 · 徐天泽</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // ==========================================
    // 清华 Git OAuth PKCE 认证逻辑
    // ==========================================
    (function() {
      // ⚠️ 请替换为你在 GitLab 拿到的 Client ID
      const GIT_CLIENT_ID = 'f6cb44834a83135bba8d8e67b94964a7d32c382699352caf34e13463e82c0dea'; 
      // ⚠️ 请替换为你实际的 GitHub Pages 部署地址
      const REDIRECT_URI = 'https://while-lian.github.io/thu-xy/oauth-callback.html'; 
      const db = window.supabaseClient;

      const gitBtn = document.getElementById('tsinghua-git-login');
      const authMsg = document.getElementById('auth-msg');
      const loginEmailInput = document.getElementById('login-email');

      // 1. 点击按钮发起 PKCE 授权
      gitBtn.addEventListener('click', async () => {
        try {
          gitBtn.disabled = true;
          gitBtn.innerHTML = '<span style="font-size:18px;">⏳</span> 正在连接清华统一认证...';
          
          // 生成 code_verifier (64位随机字符串)
          const codeVerifier = generateRandomString(64);
          // 生成 code_challenge
          const codeChallenge = await sha256(codeVerifier);
          // 生成 state 防 CSRF
          const state = generateRandomString(16);

          // 保存到 sessionStorage 供回调页面读取
          sessionStorage.setItem('oauth_code_verifier', codeVerifier);
          sessionStorage.setItem('oauth_state', state);

          // 构建授权链接
          const authUrl = new URL('https://git.tsinghua.edu.cn/oauth/authorize');
          authUrl.searchParams.set('client_id', GIT_CLIENT_ID);
          authUrl.searchParams.set('redirect_uri', REDIRECT_URI);
          authUrl.searchParams.set('response_type', 'code');
          authUrl.searchParams.set('scope', 'read_user');
          authUrl.searchParams.set('state', state);
          authUrl.searchParams.set('code_challenge', codeChallenge);
          authUrl.searchParams.set('code_challenge_method', 'S256');

          // 跳转到认证页
          window.location.href = authUrl.toString();
        } catch (err) {
          authMsg.textContent = '发起认证失败：' + err.message;
          authMsg.className = 'auth-msg error';
          gitBtn.disabled = false;
          gitBtn.innerHTML = '<span style="font-size:18px;">🎓</span> 使用清华 Git 身份登录';
        }
      });

      // 2. 监听来自 oauth-callback.html 的回调信息
      window.addEventListener('message', async (event) => {
        // 只处理我们定义的 type
        if (event.data && event.data.type === 'TSINGHUA_GIT_AUTH') {
          const gitUser = event.data.user;
          console.log('成功获取清华身份：', gitUser);

          // 恢复按钮状态
          gitBtn.disabled = false;
          gitBtn.innerHTML = '<span style="font-size:18px;">🎓</span> 使用清华 Git 身份登录';

          // 尝试根据邮箱进行登录/注册
          if (gitUser.email) {
            // 先自动填入邮箱框
            loginEmailInput.value = gitUser.email;
            
            authMsg.textContent = '清华身份认证成功，正在校验账号...';
            authMsg.className = 'auth-msg';

            // 检查 Supabase 中是否存在该邮箱的用户（由于纯前端限制，这里只能尝试使用 OTP 登录或提示）
            // 最稳妥的“一键”体验是：发送一封魔法链接（Magic Link）邮件，用户点击邮件即可直接登录。
            
            /* 
             * 方式 A：发送 Supabase 魔法链接（如果开启了 Email OTP 功能）
             * 这样用户连密码都不用输，邮箱里点一下就直接进系统了。
             */
            const { error } = await db.auth.signInWithOtp({
              email: gitUser.email,
              options: {
                shouldCreateUser: true, // 如果没注册过就自动注册
                data: {
                  nickname: gitUser.name || gitUser.username || '同学' // 自动带上真实姓名
                }
              }
            });

            if (error) {
              authMsg.textContent = '认证成功，但自动登录失败：' + error.message;
              authMsg.className = 'auth-msg error';
            } else {
              authMsg.textContent = '认证成功！已向您的清华邮箱发送登录链接，请查收邮件点击登录。';
              authMsg.className = 'auth-msg success';
            }
            
            /* 
             * 方式 B：如果你不想用邮箱链接，可以在这里提示用户：
             * "清华身份验证成功，请补充密码完成注册/登录"。
             * 但这需要你判断该邮箱是否已注册。
             */
          } else {
            authMsg.textContent = '认证成功，但未获取到清华邮箱，请联系管理员。';
            authMsg.className = 'auth-msg error';
          }
        }
      });

      // --- PKCE 辅助函数 ---
      function generateRandomString(length) {
        const array = new Uint8Array(length);
        window.crypto.getRandomValues(array);
        return Array.from(array, dec => dec.toString(16).padStart(2, '0')).join('');
      }

      async function sha256(plain) {
        const encoder = new TextEncoder();
        const data = encoder.encode(plain);
        const hash = await crypto.subtle.digest('SHA-256', data);
        // Base64 URL 编码
        return btoa(String.fromCharCode(...new Uint8Array(hash)))
          .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
    })();
  </script>
</body>
</html>
