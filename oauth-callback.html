<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>正在验证身份...</title>
</head>
<body>
  <p id="msg" style="font-family: sans-serif; text-align: center; margin-top: 50px; color: #666;">正在验证您的清华身份，请稍候...</p>
  <script>
    (async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');

      const savedState = sessionStorage.getItem('oauth_state');
      if (!code || !state || state !== savedState) {
        document.getElementById('msg').textContent = '验证失败：无效的请求。';
        return;
      }

      const codeVerifier = sessionStorage.getItem('oauth_code_verifier');
      if (!codeVerifier) {
        document.getElementById('msg').textContent = '验证失败：会话已过期。';
        return;
      }

      try {
        const tokenResponse = await fetch('https://git.tsinghua.edu.cn/oauth/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            client_id: 'f6cb44834a83135bba8d8e67b94964a7d32c382699352caf34e13463e82c0dea', // ⚠️ 替换为你的真实 ID
            code: code,
            code_verifier: codeVerifier,
            grant_type: 'authorization_code',
            redirect_uri: 'https://while-lian.github.io/thu-xy/oauth-callback.html' // ⚠️ 替换为真实回调
          })
        });

        const tokenData = await tokenResponse.json();
        if (!tokenData.access_token) throw new Error('无法获取令牌');

        const userResponse = await fetch('https://git.tsinghua.edu.cn/api/v4/user', {
          headers: { 'Authorization': `Bearer ${tokenData.access_token}` },
          cache: 'no-store'
        });

        const userData = await userResponse.json();
        
        document.getElementById('msg').textContent = '认证成功！正在返回原页面...';

        // 【核心】把数据发回给父窗口
        if (window.opener) {
          window.opener.postMessage({ 
            type: 'TSINGHUA_GIT_AUTH', 
            user: userData 
          }, '*');
        }

        sessionStorage.removeItem('oauth_state');
        sessionStorage.removeItem('oauth_code_verifier');
        
        // 自动关闭弹窗
        setTimeout(() => {
          window.close();
        }, 800);

      } catch (err) {
        document.getElementById('msg').textContent = '认证过程出错：' + err.message;
      }
    })();
  </script>
</body>
</html>
