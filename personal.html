<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人管理</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="topbar" class="topbar"></div>

  <main class="page-main">
    <header class="page-header">
      <h1>个人管理</h1>
      <p class="page-desc">管理你的个人日程、DDL、查阅班委手册与资源</p>
    </header>

    <!-- 个人日程 / DDL -->
    <section class="block">
      <div class="block-header">
        <div class="pe-tabs">
          <button class="pe-tab active" data-tab="event">📅 我的日程</button>
          <button class="pe-tab" data-tab="ddl">⏰ 我的 DDL</button>
        </div>
        
        <div style="display:flex; gap:10px;">
          <button id="pe-export-btn" class="btn btn-ghost btn-small">📥 导出日历</button>
          <button id="pe-add-btn" class="btn btn-primary btn-small">＋ 添加日程</button>
        </div>


      </div>
      <div id="pe-list" class="pe-list">
        <div class="pe-empty">加载中…</div>
      </div>
    </section>

    <!-- 班委手册 -->
    <section class="block">
      <h2 class="block-title">📖 行健班委手册</h2>
      <div class="pdf-actions">
        <a href="行健书院班委手册.pdf" download class="btn btn-primary">📥 下载 PDF</a>
      </div>
      <div class="pdf-viewer-container">
        <iframe class="pdf-viewer"
          src="行健书院班委手册.pdf#toolbar=1&navpanes=1&scrollbar=1"
          type="application/pdf"
          title="行健书院班委手册">
          <p>您的浏览器不支持 PDF 预览，请<a href="行健书院班委手册.pdf" download>点击下载</a>查看。</p>
        </iframe>
      </div>
      <p style="margin-top:12px;color:#999;font-size:13px;">
        💡 提示：可在上方阅读器中直接翻阅，也可下载到本地。
      </p>
    </section>

    <!-- THU 手册 -->
    <section class="block">
      <h2 class="block-title">🔗 THU 手册</h2>
      <a href="https://thubook.help/" target="_blank" class="link-card">
        <div class="link-card-title">THUxk · THU 学术资源与学习社区</div>
        <div class="link-card-desc">
          Thubook 校园生存手册 & Thucourse 选课点评社区，由清华同学自发维护的学习资源平台。
          包含课程评价、学习资料、生活指南等丰富内容。
        </div>
        <span class="link-card-badge">🔗 友情链接</span>
      </a>
    </section>
  </main>

  <footer class="site-footer">
    <p>THU-XY · 个人管理</p>
  </footer>

  <!-- 日程 / DDL 编辑弹窗 -->
  <div id="pe-modal" class="modal" style="display: none;">
    <div class="modal-box" style="width: 480px;">
      <h3 id="pe-modal-title">添加日程</h3>
      <input type="hidden" id="pe-f-type" value="event" />
      <div class="form-grid">
        <label for="pe-f-title">标题</label>
        <input type="text" id="pe-f-title" placeholder="如：小组会议 / 数学作业" maxlength="50" />
        <label for="pe-f-date">日期</label>
        <input type="date" id="pe-f-date" />
        <label for="pe-f-time">时间</label>
        <input type="text" id="pe-f-time" placeholder="如：14:00-15:30（选填）" />
        <label>地点</label>
        <input type="text" id="pe-f-location" placeholder="选填" />
        <label>备注</label>
        <input type="text" id="pe-f-remark" placeholder="选填" />
      </div>
      <p id="pe-msg" class="form-msg"></p>
      <div class="modal-buttons">
        <button id="pe-save" class="btn btn-primary">保存</button>
        <button id="pe-cancel" class="btn btn-ghost">取消</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/personal-events.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
