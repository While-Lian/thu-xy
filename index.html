<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THU-XY · 清华大学行健书院班级管理平台</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 顶部校名条（仿清华官网风格） -->
  <div class="top-bar">
    <span class="top-bar-school">清华大学 · 行健书院</span>
    <span class="top-bar-motto">行健不息 · 需自强</span>
  </div>

  <!-- 页头 -->
  <header class="site-header">
    <h1 id="site-name" class="site-name">THU-XY</h1>
    <p class="site-subtitle">清华大学行健书院 · 班级管理平台</p>
  </header>

  <!-- 三个主板块（要增加板块：在 config.js 的 sections 中追加，并在此复制一个卡片） -->
  <main class="home-main">
    <div class="card-container">

      <!-- 板块一：班级管理 -->
      <div class="section-card" id="card-class">
        <div class="card-title">班级管理</div>
        <div class="dropdown">
          <a href="class.html?id=xingjian63">行健63班</a>
          <a href="class.html?id=xingjian-li6">行健-力6班</a>
          <a href="#" class="disabled" title="该功能后续开放">创建自己的班级（敬请期待）</a>
        </div>
      </div>

      <!-- 板块二：实践管理（暂未开放） -->
      <div class="section-card card-disabled" id="card-practice">
        <div class="card-title">实践管理</div>
        <div class="card-coming-soon">敬请期待</div>
      </div>

      <!-- 板块三：个人管理（暂未开放） -->
      <div class="section-card card-disabled" id="card-personal">
        <div class="card-title">个人管理</div>
        <div class="card-coming-soon">敬请期待</div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <p>THU-XY · 行健书院班级管理平台 · 仅供班级内部使用</p>
  </footer>

  <script src="js/config.js"></script>
  <script>
    // 网站名称与副标题从配置文件读取
    document.getElementById("site-name").textContent = SITE_CONFIG.siteName;
    document.querySelector(".site-subtitle").textContent = SITE_CONFIG.siteSubtitle;
    document.title = SITE_CONFIG.siteName + " · " + SITE_CONFIG.siteSubtitle;

    // 手机端：点击"班级管理"卡片切换下拉菜单
    const cardClass = document.getElementById("card-class");
    const dropdown = cardClass.querySelector(".dropdown");
    let isDropdownOpen = false;

    // 检测是否为小屏幕（手机端）
    const isMobileView = () => window.innerWidth <= 640;

    // 手机端：点击切换
    cardClass.addEventListener("click", (e) => {
      // 只在手机视口下启用点击切换
      if (!isMobileView()) return;

      // 如果点击的是下拉菜单内的链接，不阻止默认行为
      if (e.target.closest('.dropdown a')) {
        return;
      }

      e.preventDefault();
      isDropdownOpen = !isDropdownOpen;

      if (isDropdownOpen) {
        dropdown.style.display = "block";
        // 给下方卡片添加间距
        const siblings = Array.from(cardClass.parentElement.children);
        const currentIndex = siblings.indexOf(cardClass);
        siblings.slice(currentIndex + 1).forEach(card => {
          card.style.marginTop = "160px";
          card.style.transition = "margin-top 0.2s";
        });
      } else {
        dropdown.style.display = "none";
        // 恢复下方卡片位置
        const siblings = Array.from(cardClass.parentElement.children);
        const currentIndex = siblings.indexOf(cardClass);
        siblings.slice(currentIndex + 1).forEach(card => {
          card.style.marginTop = "";
        });
      }
    });

    // 点击页面其他地方关闭下拉菜单
    document.addEventListener("click", (e) => {
      if (!isMobileView()) return;
      
      if (!cardClass.contains(e.target) && isDropdownOpen) {
        dropdown.style.display = "none";
        isDropdownOpen = false;
        const siblings = Array.from(cardClass.parentElement.children);
        const currentIndex = siblings.indexOf(cardClass);
        siblings.slice(currentIndex + 1).forEach(card => {
          card.style.marginTop = "";
        });
      }
    });
  </script>
</body>
</html>
