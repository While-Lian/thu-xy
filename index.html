<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>清华大学行健书院班级共建</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="topbar" class="topbar"></div>

  <main class="page-main">
    <section class="hero">
      <h1 class="hero-title">清华大学行健书院班级共建</h1>
      <p class="hero-subtitle">班级事务 · 交流论坛 · 文件共享</p>
    </section>

    <!-- 我的日程 & DDL 提醒 -->
    <section class="block" id="home-schedule-block" style="display:none;">
      <div class="block-header">
        <h2 class="block-title">⏰ 我的日程与 DDL</h2>
        <a href="personal.html" class="btn btn-ghost btn-small">前往个人管理 →</a>
      </div>
      <div id="home-schedule-list" class="home-schedule-list"></div>
    </section>

    <section class="block">
      <h2 class="block-title">📌 班级公告板</h2>
      <div id="announcement-list" class="announcement-list">
        <div class="announcement-empty">加载中…</div>
      </div>
    </section>

    <section class="block about-block">
      <h2 class="block-title">关于本系统</h2>
      <p class="about-purpose" id="about-purpose"></p>
      <div class="about-devs">
        <span class="about-label">开发者：</span>
        <span id="about-devs-list"></span>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>THU-XY · 清华大学行健书院班级共建系统</p>
    <p class="footer-note">非官方系统 · 仅供班级内部使用</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      const U = window.Utils;
      const db = window.supabaseClient;

      document.getElementById('about-purpose').textContent = SITE_CONFIG.purpose;
      document.getElementById('about-devs-list').textContent = SITE_CONFIG.developers.join(' · ');

      function todayStr() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }
      function daysUntil(dateStr) {
        const today = new Date(todayStr() + 'T00:00:00');
        const target = new Date(dateStr + 'T00:00:00');
        return Math.round((target - today) / 86400000);
      }

      window.addEventListener('user-ready', async () => {
        /* ---- 1. 首页个人日程 / DDL 提醒 ---- */
        loadMySchedule();

        /* ---- 2. 班级公告板 ---- */
        loadAnnouncements();
      });

      async function loadMySchedule() {
        const block = document.getElementById('home-schedule-block');
        const listEl = document.getElementById('home-schedule-list');
        if (!block || !listEl) return;

        const { data, error } = await db
          .from('personal_events')
          .select('*')
          .eq('user_id', window.currentUser.id)
          .order('event_date', { ascending: true });

        if (error || !data) return;

        const today = todayStr();
        const inSevenDays = new Date();
        inSevenDays.setDate(inSevenDays.getDate() + 7);
        const sevenStr = `${inSevenDays.getFullYear()}-${String(inSevenDays.getMonth() + 1).padStart(2, '0')}-${String(inSevenDays.getDate()).padStart(2, '0')}`;

        // 未来 7 天日程
        const upcomingEvents = data.filter(i =>
          i.type === 'event' && i.event_date >= today && i.event_date <= sevenStr
        );
        // 未完成 DDL（全部显示，按日期）
        const undoneDdls = data.filter(i => i.type === 'ddl' && !i.completed)
          .sort((a, b) => a.event_date.localeCompare(b.event_date));

        if (upcomingEvents.length === 0 && undoneDdls.length === 0) {
          block.style.display = 'none';
          return;
        }

        block.style.display = 'block';
        let html = '';

        // DDL 部分（更重要，放前面）
        if (undoneDdls.length) {
          html += '<div class="home-section-title">📌 DDL 待办</div>';
          html += '<div class="home-ddl-list">';
          undoneDdls.forEach(d => {
            const diff = daysUntil(d.event_date);
            let urgencyClass = '';
            let urgencyLabel = '';
            if (diff < 0) { urgencyClass = 'ddl-overdue'; urgencyLabel = `逾期 ${-diff} 天`; }
            else if (diff === 0) { urgencyClass = 'ddl-today'; urgencyLabel = '今天到期'; }
            else if (diff <= 3) { urgencyClass = 'ddl-soon'; urgencyLabel = `${diff} 天后`; }
            else if (diff <= 7) { urgencyClass = 'ddl-week'; urgencyLabel = `${diff} 天后`; }
            else { urgencyClass = 'ddl-far'; urgencyLabel = `${diff} 天后`; }

            const dObj = new Date(d.event_date + 'T00:00:00');
            const dateStr = `${dObj.getMonth() + 1}月${dObj.getDate()}日`;
            const timeStr = d.event_time ? ' ' + U.escapeHtml(d.event_time) : '';

            html += `
              <div class="home-ddl-item ${urgencyClass}">
                <div class="home-ddl-tag ${urgencyClass}">${urgencyLabel}</div>
                <div class="home-ddl-body">
                  <div class="home-ddl-title">${U.escapeHtml(d.title)}</div>
                  <div class="home-ddl-meta">${dateStr}${timeStr}</div>
                </div>
                <button class="home-ddl-done" data-done="${d.id}">✓ 已完成</button>
              </div>`;
          });
          html += '</div>';
        }

        // 日程部分
        if (upcomingEvents.length) {
          html += '<div class="home-section-title" style="margin-top:18px;">📅 未来 7 天日程</div>';
          html += '<div class="home-event-list">';
          upcomingEvents.forEach(e => {
            const dObj = new Date(e.event_date + 'T00:00:00');
            const monthDay = `${dObj.getMonth() + 1}月${dObj.getDate()}日`;
            const weekday = ['周日','周一','周二','周三','周四','周五','周六'][dObj.getDay()];
            const timeStr = e.event_time ? ' · ' + U.escapeHtml(e.event_time) : '';
            const locStr = e.location ? ' · ' + U.escapeHtml(e.location) : '';
            const isToday = e.event_date === today;
            html += `
              <div class="home-event-item${isToday ? ' home-event-today' : ''}">
                <div class="home-event-date">
                  <div class="home-event-md">${monthDay}</div>
                  <div class="home-event-wd">${weekday}</div>
                </div>
                <div class="home-event-body">
                  <div class="home-event-title">${U.escapeHtml(e.title)}${isToday ? ' <span class="today-tag">今天</span>' : ''}</div>
                  <div class="home-event-meta">${timeStr}${locStr}</div>
                </div>
              </div>`;
          });
          html += '</div>';
        }

        listEl.innerHTML = html;

        // 绑定"已完成"按钮
        listEl.querySelectorAll('[data-done]').forEach(btn => {
          btn.addEventListener('click', async () => {
            btn.disabled = true;
            const { error } = await db.from('personal_events')
              .update({ completed: true }).eq('id', btn.dataset.done);
            if (error) {
              alert('操作失败：' + error.message);
              btn.disabled = false;
              return;
            }
            loadMySchedule(); // 刷新
          });
        });
      }

      async function loadAnnouncements() {
        const list = document.getElementById('announcement-list');
        const classId = window.currentClassId;

        const { data, error } = await db
          .from('class_activities')
          .select('activities')
          .eq('class_id', classId)
          .single();

        if (error || !data || !data.activities || data.activities.length === 0) {
          list.innerHTML = '<div class="announcement-empty">近期暂无班级事务</div>';
          return;
        }

        const start = new Date(SITE_CONFIG.semesterStart + 'T00:00:00');
        const diffDays = Math.floor((Date.now() - start.getTime()) / 86400000);
        const cw = Math.floor(diffDays / 7) + 1;
        const isValidWeek = cw >= 1 && cw <= SITE_CONFIG.totalWeeks;

        let items = [];
        if (isValidWeek) {
          items = data.activities.filter(a =>
            Array.isArray(a.weeks) && a.weeks.some(w => w === cw || w === cw + 1)
          );
        }
        if (items.length === 0) items = [...data.activities].slice(0, 5);
        items.sort((a, b) => (a.weeks?.[0] || 99) - (b.weeks?.[0] || 99));

        if (items.length === 0) {
          list.innerHTML = '<div class="announcement-empty">近期暂无班级事务</div>';
          return;
        }

        list.innerHTML = items.slice(0, 6).map(a => {
          const weeks = Array.isArray(a.weeks) ? a.weeks : [];
          const weekStr = weeks.length
            ? (weeks.length === 1 ? `第${weeks[0]}周` : `第${weeks[0]}-${weeks[weeks.length - 1]}周`)
            : '';
          return `
            <div class="announcement-item">
              <div class="announcement-week">${weekStr}</div>
              <div class="announcement-body">
                <div class="announcement-title">${U.escapeHtml(a.title || '')}</div>
                <div class="announcement-meta">${U.escapeHtml(a.time || '')} ${U.escapeHtml(a.location || '')}</div>
              </div>
            </div>`;
        }).join('');
      }
    })();
  </script>
</body>
</html>
