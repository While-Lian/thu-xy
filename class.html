<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>班级事务</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="topbar" class="topbar"></div>

  <main class="page-main class-main">
    <header class="page-header">
      <h1 id="class-name">班级事务</h1>
      <div class="filter-bar">
        <label>我的职务：</label>
        <select id="position-filter">
          <option value="">（全部工作安排）</option>
        </select>
        <input type="text" id="name-filter" placeholder="我的姓名（可选）" />
        <button id="filter-clear" class="btn btn-ghost btn-small">清除筛选</button>
      </div>
    </header>

    <section class="block">
      <h2 class="block-title">近期工作安排</h2>
      <div class="table-wrapper">
        <table class="activity-table" id="recent-table">
          <thead>
            <tr>
              <th>周次</th><th>活动标题</th><th>时间</th><th>地点</th>
              <th>主要要求</th><th>主要负责人</th><th>次要负责人</th><th>备注</th><th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="block">
      <div class="block-header">
        <h2 class="block-title">本学期工作安排</h2>
        <div class="view-switch">
          <button class="view-btn active" data-view="timeline">时间轴</button>
          <button class="view-btn" data-view="schedule">时间表</button>
          <button class="view-btn" data-view="list">列表</button>
        </div>
      </div>

      <div class="timeline" id="view-timeline"></div>

      <div class="table-wrapper" id="view-schedule" style="display: none;">
        <table class="schedule-table" id="schedule-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>

      <div id="view-list" style="display: none;">
        <div class="table-wrapper">
          <table class="activity-table" id="semester-table">
            <thead>
              <tr>
                <th>周次</th><th>活动标题</th><th>时间</th><th>地点</th>
                <th>主要要求</th><th>主要负责人</th><th>次要负责人</th><th>备注</th><th>操作</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <button id="add-activity" class="btn btn-primary add-btn admin-only">＋ 添加活动</button>
    </section>
  </main>

  <footer class="site-footer">
    <p>THU-XY · 班级事务</p>
  </footer>

  <!-- 编辑弹窗 -->
  <div id="edit-modal" class="modal" style="display: none;">
    <div class="modal-box">
      <h3 id="modal-title">编辑活动</h3>
      <div class="form-grid">
        <label>周次（可多选）</label>
        <div>
          <div id="f-weeks" class="week-chips"></div>
          <div class="week-chips-helper">
            <button type="button" id="weeks-clear" class="link-btn">清空</button>
            <span class="helper-tip">点击数字选择，可跨周多选</span>
          </div>
        </div>
        <label>活动标题</label><input type="text" id="f-title" />
        <label>时间</label><input type="text" id="f-time" placeholder="如：周六 14:00-16:00" />
        <label>地点</label><input type="text" id="f-location" />
        <label>主要要求</label><input type="text" id="f-requirement" />
        <label>主要负责人</label><div id="f-main-owner" class="owner-list"></div>
        <label>次要负责人</label><div id="f-sub-owners" class="owner-list"></div>
        <label>备注</label><input type="text" id="f-remark" />
      </div>
      <div class="modal-buttons">
        <button id="modal-save" class="btn btn-primary">保存</button>
        <button id="modal-cancel" class="btn btn-ghost">取消</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/class.js"></script>
</body>
</html>
